# 单一工程参数源 — 桌面AGV与机器人仓储Demo
# design_version 2.2.0 · 所有数值单位后缀强制 · 修改须同步 design_version
# 2.2.0 (2026-10-11): ForkliftCell 多车参数化 (vehicles, 一个 MJCF N 车 +
#   共享环境, 可动件 <vid>_ 前缀命名空间)、F02 行程 range 按插叉位放宽、
#   AisleLock 巷道互斥、mocap 锥桶 + LiDAR 观测通道 (P4a)、Decision
#   Memory (P4b)、交接任务「前移让位」。静态环境与单车几何零改动, CAD
#   模板不变 (仅 manifest 版本联动)。理由与实测见 reports/v2.2.0 验收
#   报告与 tests/test_r2_compound.py。
# 2.1.0 (2026-10-10): 叉架背板分两片置横梁 y 空隙且高于叉顶、叉孔摩擦 1.4、
#   插深 65mm 明确为叉尖语义、ESTOP 改减速度受限斜坡 (12 m/s²)。
#   理由与实测见 reports/t06_relay_limit.md 与 v2.1.0 验收报告 §6.2。
design_version: "2.2.0"
schema_version: "2.0"
units: {length: m, mass: kg, angle: rad, time: s}

table:
  length_m: 1.8
  width_m: 1.2
  edge_clearance_m: 0.080          # 桌边静态退让

regions:                            # 世界坐标 mm→m, 左下角原点, X右 Y上
  rack_a: {x_min_m: 0.350, x_max_m: 0.740, y_min_m: 0.940, y_max_m: 1.100}
  rack_b: {x_min_m: 0.960, x_max_m: 1.350, y_min_m: 0.940, y_max_m: 1.100}
  work_band: {x_min_m: 0.250, x_max_m: 1.450, y_min_m: 0.450, y_max_m: 0.920}
  handoff_h01: {x_m: 0.850, y_m: 0.350}
  inbound_i01: {x_m: 0.250, y_m: 0.250}
  outbound_o01: {x_m: 1.400, y_m: 0.250}
  park_p01: {x_m: 0.650, y_m: 0.200, yaw_rad: 1.5707963267948966}
  # park_p02 朝向: 车头 (本体 X) 须沿 +X, 才能沿 X 往返货架 A/B。
  # 原 -π/2 使车头指向 -Y, 而轮轴在本地 Y ⇒ 轮子只能驱动车辆沿 Y 移动,
  # 与货架作业带 (y∈[0.45,0.92], 货架 y∈[0.94,1.10]) 的走向垂直 ——
  # 实测开满扭矩 40 秒仅沿 -Y 走了 0.29m, x 方向几乎不动。
  # 改为 0 后车头沿 +X。桌边 80mm 退让与 209mm 转向半径的复核见
  # reports/w04_scene_deviation.md。
  park_p02: {x_m: 1.550, y_m: 0.900, yaw_rad: 0.0}
  m01_base_m: [0.150, 0.470, 0.000]
  m02_base_m: [1.650, 0.470, 0.000]
  feed_i_tray: {x_m: 0.150, y_m: 0.150, top_z_m: 0.055}
  feed_o_tray: {x_m: 1.650, y_m: 0.150, top_z_m: 0.055}
  arm_in_zone: {x_min_m: 0.080, x_max_m: 0.520, y_min_m: 0.080, y_max_m: 0.700, z_max_m: 0.650}
  arm_out_zone: {x_min_m: 1.200, x_max_m: 1.720, y_min_m: 0.080, y_max_m: 0.700, z_max_m: 0.650}

pallet:
  body_size_m: [0.080, 0.060, 0.018]
  total_size_m: [0.080, 0.060, 0.021]      # 含3mm定位凸边
  cargo_support_local_z_m: 0.018
  locator_inner_size_m: [0.070, 0.050]
  locator_height_m: 0.003
  tare_mass_max_kg: 0.050
  cargo_mass_max_kg: 0.200
  channel_centers_y_m: [-0.015, 0.015]
  channel_width_m: 0.018
  channel_height_m: 0.008
  channel_z_m: [0.004, 0.012]              # 开孔 z 4→12mm, X向贯通
  tare_mass_kg: 0.045                       # 设计初值(含凸边, ≤0.050)

fork:
  mounting_root_x_m: 0.040
  size_m: [0.080, 0.010, 0.0025]
  centers_y_m: [-0.015, 0.015]
  insertion_depth_m: 0.065
  top_z_range_m: [0.020, 0.450]
  insert_tip_clearance_z_m: 0.010          # 插叉时叉顶面=支撑面+10mm
  engage_lift_z_m: 0.017                    # 接触叉孔顶+抬离5mm

forklift:
  body_bounds_x_m: [-0.195, 0.025]         # 前轮轴为原点
  body_width_m: 0.150
  mast_height_m: 0.540
  drive_contact_xy_m: [[0.000, -0.060], [0.000, 0.060]]
  rear_contact_xy_m: [[-0.160, -0.055], [-0.160, 0.055]]
  fixed_mass_kg: 1.500
  fixed_com_x_m: -0.050
  carriage_mass_kg: 0.250
  carriage_com_x_m: 0.045
  pallet_loaded_com_x_m: 0.095
  transport_fork_top_z_m: 0.065
  high_motion_threshold_m: 0.100
  turn_envelope_diameter_m: 0.430
  lift_speed_max_mps: 0.010
  lift_travel_m: 0.430
  lift_force_max_n: 14.7
  wheel_radius_m: 0.025
  wheel_base_y_m: 0.120

flat_agv:
  size_xy_m: [0.160, 0.110]
  fixed_body_height_max_m: 0.035
  platform_z_m: [0.045, 0.065]
  platform_size_m: [0.070, 0.040]
  platform_travel_m: 0.020
  platform_force_max_n: 15.0
  wheel_radius_m: 0.015

rack:
  groups: 2
  columns: 3
  levels: 3
  support_z_m: [0.100, 0.250, 0.400]
  level_pitch_m: 0.150
  slot_clearance_m: [0.110, 0.120, 0.120]  # 宽/深/净高
  column_centers_group_a_x_m: [0.415, 0.545, 0.675]
  column_centers_group_b_x_m: [1.025, 1.155, 1.285]
  front_y_m: 0.940
  slot_center_y_m: 1.000
  overall_size_m: [0.390, 0.160, 0.540]

station:
  support_z_m: 0.055
  rail_base_z_m: 0.045
  entry_clear_width_min_m: 0.140
  rail_support_y_m: [-0.027, 0.027]
  rail_support_width_m: 0.006
  count: 3                                  # I01/H01/O01

goods:
  size_m: [0.060, 0.040, 0.050]
  mass_kg: 0.200
  label_side_m: 0.025
  initial_binding: null
  physics_mode: free_body_contact

manipulators:
  instances:
    - {robot_id: M01, base_position_m: [0.150, 0.470, 0.000], station_id: I01}
    - {robot_id: M02, base_position_m: [1.650, 0.470, 0.000], station_id: O01}
  reach_geometric_upper_m: 0.480
  payload_mass_max_kg: 0.200
  # 收拢包络 (设计 981: 收拢姿态须求解并以全部连杆碰撞体验证, 不能只检查TCP)。
  # 实测 (sim/solve_stow.py, 粗搜+局部细搜, 按 body 归属筛选臂链 geom,
  #       位置误差 <0.05rad 判到位):
  #   q_stow = [0, -1.3528, -0.2962, 0, -0.3056, 0] → 臂体折**垂直向上**
  #   水平半径 42.3mm ≤ 设计 70mm ✓, 最高点 526.0mm ≤ 600mm ✓,
  #   活动连杆最低点 70.0mm ≥ 托台面 55mm (不穿台) ✓
  # 即设计初值 70mm **可达**, 求解结果落在其内。逐连杆见
  # reports/stow_envelope.json。
  stow_xy_radius_initial_m: 0.070        # 设计初值, 判据取用
  stow_z_limit_m: 0.600
  stow_q_rad: [0.0, -1.352802, -0.296165, 0.0, -0.305605, 0.0]
  base_radius_m: 0.040
  joints:
    - {name: J1, kind: revolute, axis: [0,0,1], offset_m: [0,0,0.070], lower_rad: -3.141592653589793, upper_rad: 3.141592653589793, vel_max_radps: 0.5, acc_max_radps2: 1.0, torque_max_nm: 3.0}
    - {name: J2, kind: revolute, axis: [0,1,0], offset_m: [0,0,0], lower_rad: -2.4, upper_rad: 2.4, vel_max_radps: 0.5, acc_max_radps2: 1.0, torque_max_nm: 5.0}
    - {name: J3, kind: revolute, axis: [0,1,0], offset_m: [0.200,0,0], lower_rad: -2.6, upper_rad: 2.6, vel_max_radps: 0.5, acc_max_radps2: 1.0, torque_max_nm: 2.0}
    - {name: J4, kind: revolute, axis: [1,0,0], offset_m: [0.180,0,0], lower_rad: -3.141592653589793, upper_rad: 3.141592653589793, vel_max_radps: 0.8, acc_max_radps2: 1.6, torque_max_nm: 0.8}
    - {name: J5, kind: revolute, axis: [0,1,0], offset_m: [0.035,0,0], lower_rad: -2.4, upper_rad: 2.4, vel_max_radps: 0.8, acc_max_radps2: 1.6, torque_max_nm: 0.8}
    - {name: J6, kind: revolute, axis: [1,0,0], offset_m: [0.025,0,0], lower_rad: -3.141592653589793, upper_rad: 3.141592653589793, vel_max_radps: 0.8, acc_max_radps2: 1.6, torque_max_nm: 0.5}
  tcp_offset_m: [0.040, 0, 0]
  link_mass_kg: {upper_arm: 0.30, forearm: 0.25, wrist_gripper: 0.20}
  gripper:
    gap_range_m: [0.000, 0.075]
    gap_speed_max_mps: 0.020
    force_per_finger_target_n: 5.000
    force_per_finger_max_n: 8.000
    pad_friction_initial: 0.600
    pad_size_m: [0.010, 0.015]
    pad_center_above_box_base_m: 0.025
    palm_size_m: [0.070, 0.020, 0.015]
    palm_center_above_tcp_z_m: 0.045
    finger_size_m: [0.006, 0.010, 0.045]
  grasp_lift_m: 0.050
  tcp_speed_max_mps: 0.050
  contact_approach_speed_max_mps: 0.005
  stow_evidence_max_age_s: 0.100
  ik:
    max_iterations: 200
    seeds: 8
    pos_tol_m: 0.001
    rot_tol_rad: 0.03490658503988659        # 2°
    joint_limit_margin_rad: 0.05
    pos_scale_m: 0.050
    rot_scale_rad: 1.0

robots:
